[project]
name = "cogu"
version = "0.0.1"
description = "Cogu — robô bípede cogumelo, open source e open hardware. CAD paramétrico, simulação e firmware."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Alessandro La Rocca Silveira" }]
dependencies = [
    "build123d==0.13.0",
    "imageio[ffmpeg]==2.38.1",
    "jax==0.11.2",
    "mujoco==3.17.0",
    "numpy>=2.4.6",
    "playground==0.2.0",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad"]

[tool.uv]
package = false
