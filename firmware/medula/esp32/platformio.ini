; The medula on the Waveshare Servo Driver with ESP32 (ESP32-WROOM-32, 4 MB flash). The core (../src) is the same
; code the simulator runs (sim/brain/medula_c.py); this adds the servo bus, the IMU, BLE and the 50 Hz loop.
;     cd firmware/medula/esp32 && pio run              # build (make -C .. first: the generated headers)
;     pio run -t upload && pio device monitor          # on the bench
; Compiled, not yet run on the board: the pins, the IMU and the calibration are to be checked on the bench.

[platformio]
src_dir = ..
default_envs = waveshare_servo_driver

[env:waveshare_servo_driver]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv          ; 3 MB app: BLE + 320 kB of weights
build_src_filter = -<*> +<src/*.cpp> -<src/sil.cpp> +<esp32/src/*.cpp>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -O2 -I../src -I../gen -Isrc -DCORE_DEBUG_LEVEL=1
lib_deps = h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
